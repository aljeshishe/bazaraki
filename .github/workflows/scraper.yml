name: Bazaraki Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install uv
      run: |
        pip install uv

    # The site sits behind Cloudflare, which serves GitHub's runner ranges a JS
    # challenge instead of content. Say so up front rather than spending an hour
    # retrying 403s and reporting an empty crawl.
    - name: Check site reachability
      env:
        BAZARAKI_PROXY: ${{ secrets.BAZARAKI_PROXY }}
      run: |
        url="https://www.bazaraki.com/api/v2/spa/adverts/count/"
        # Never echo the variable itself: it may carry credentials.
        if [ -n "$BAZARAKI_PROXY" ]; then proxy=yes; else proxy=no; fi
        # A rotating proxy hands out a different exit IP per connection and Cloudflare
        # refuses some of them, so one 403 proves nothing. Only a clean sweep does.
        ok=0
        for attempt in 1 2 3 4 5; do
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
            ${BAZARAKI_PROXY:+--proxy "$BAZARAKI_PROXY"} \
            -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:140.0) Gecko/20100101 Firefox/140.0" "$url")
          echo "  attempt $attempt: $code  (proxy: $proxy)"
          [ "$code" = "200" ] && ok=1 && break
        done
        if [ "$ok" != "1" ]; then
          # Which IP the site actually saw decides whether the proxy is even in the path.
          echo "runner exit IP: $(curl -s --max-time 20 https://api.ipify.org || echo unknown)"
          if [ -n "$BAZARAKI_PROXY" ]; then
            echo "proxy  exit IP: $(curl -s --max-time 20 --proxy "$BAZARAKI_PROXY" https://api.ipify.org || echo 'unreachable')"
          fi
          echo "::error::Cloudflare refused all 5 attempts (last: $code, $(grep -o 'Just a moment\|Cloudflare' /tmp/body | head -1))."
          echo "::error::If the two IPs above match, BAZARAKI_PROXY is not reaching the request."
          echo "::error::If they differ, five rotated exit IPs in a row were refused, so the"
          echo "::error::proxy pool itself is blocked — it needs residential, not datacenter, exits."
          exit 1
        fi

    - name: Run scraper
      env:
        BAZARAKI_PROXY: ${{ secrets.BAZARAKI_PROXY }}
      run: |
        uv run scrapy crawl property_spider -a urls=https://www.bazaraki.com/real-estate-to-rent,https://www.bazaraki.com/real-estate-for-sale

    # A crawl that scrapes nothing still exits 0 and still writes a file, which used to
    # show up as a green run for weeks. Make an empty crawl fail loudly instead.
    - name: Check crawl produced data
      if: always()
      run: |
        tail -40 output/logs/*.log || true
        uv run python - <<'PY'
        import glob, sys
        import pandas as pd
        files = sorted(glob.glob("output/*.parquet"))
        if not files:
            sys.exit("No parquet written")
        rows = len(pd.read_parquet(files[-1]))
        print(f"{files[-1]}: {rows} ads")
        if rows < 1000:
            sys.exit(f"Crawl returned {rows} ads, expected tens of thousands")
        PY
        
    - name: Configure AWS credentials
      if: success()
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # Change this to your preferred region

    - name: Sync to S3
      if: success()
      run: |
        aws s3 sync output s3://ab-users/grachev/bazaraki/output

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: scraper-logs
        path: output/logs/
        retention-days: 7
