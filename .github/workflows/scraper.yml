name: Bazaraki Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install uv
      run: |
        pip install uv

    # The site sits behind Cloudflare, which serves GitHub's runner ranges a JS
    # challenge instead of content. Say so up front rather than spending an hour
    # retrying 403s and reporting an empty crawl.
    - name: Check site reachability
      env:
        BAZARAKI_PROXY: ${{ secrets.BAZARAKI_PROXY }}
      run: |
        url="https://www.bazaraki.com/api/v2/spa/adverts/count/"
        code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
          ${BAZARAKI_PROXY:+--proxy "$BAZARAKI_PROXY"} \
          -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:140.0) Gecko/20100101 Firefox/140.0" "$url")
        # Never echo the variable itself: it may carry credentials.
        if [ -n "$BAZARAKI_PROXY" ]; then proxy=yes; else proxy=no; fi
        echo "$code  $url  (proxy: $proxy)"
        if [ "$code" != "200" ]; then
          echo "::error::Cloudflare is blocking this runner ($code, $(grep -o 'Just a moment\|Cloudflare' /tmp/body | head -1))."
          echo "::error::GitHub-hosted runners sit in datacenter ranges the site refuses."
          echo "::error::Set the BAZARAKI_PROXY secret, or run this job on a self-hosted runner."
          exit 1
        fi

    - name: Run scraper
      env:
        BAZARAKI_PROXY: ${{ secrets.BAZARAKI_PROXY }}
      run: |
        uv run scrapy crawl property_spider -a urls=https://www.bazaraki.com/real-estate-to-rent,https://www.bazaraki.com/real-estate-for-sale

    # A crawl that scrapes nothing still exits 0 and still writes a file, which used to
    # show up as a green run for weeks. Make an empty crawl fail loudly instead.
    - name: Check crawl produced data
      if: always()
      run: |
        tail -40 output/logs/*.log || true
        uv run python - <<'PY'
        import glob, sys
        import pandas as pd
        files = sorted(glob.glob("output/*.parquet"))
        if not files:
            sys.exit("No parquet written")
        rows = len(pd.read_parquet(files[-1]))
        print(f"{files[-1]}: {rows} ads")
        if rows < 1000:
            sys.exit(f"Crawl returned {rows} ads, expected tens of thousands")
        PY
        
    - name: Configure AWS credentials
      if: success()
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # Change this to your preferred region

    - name: Sync to S3
      if: success()
      run: |
        aws s3 sync output s3://ab-users/grachev/bazaraki/output

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: scraper-logs
        path: output/logs/
        retention-days: 7
