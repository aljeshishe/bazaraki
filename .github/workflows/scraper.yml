name: Bazaraki Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install uv
      run: |
        pip install uv

    # Probe with the same stack the crawler uses. Cloudflare refuses curl outright
    # from here — 5 of 5 — while python sails through on the very same proxy and exit
    # IP, so a curl-based probe reports a block that the crawl itself never hits.
    - name: Check site reachability
      env:
        BAZARAKI_PROXY: ${{ secrets.BAZARAKI_PROXY }}
      run: |
        python - <<'PY'
        import os, sys, urllib.request
        url = "https://www.bazaraki.com/api/v2/spa/adverts/count/"
        proxy = os.environ.get("BAZARAKI_PROXY", "")
        opener = urllib.request.build_opener(
            urllib.request.ProxyHandler({"http": proxy, "https": proxy} if proxy else {}))
        opener.addheaders = [("User-Agent",
            "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:140.0) Gecko/20100101 Firefox/140.0")]
        # A rotating proxy hands out a fresh exit IP per connection and some are refused,
        # so one rejection proves nothing — only a clean sweep does.
        for attempt in range(1, 6):
            try:
                with opener.open(url, timeout=30) as r:
                    print(f"  attempt {attempt}: {r.status} (proxy: {'yes' if proxy else 'no'})")
                    if r.status == 200:
                        sys.exit(0)
            except Exception as e:
                code = getattr(e, "code", type(e).__name__)
                print(f"  attempt {attempt}: {code} (proxy: {'yes' if proxy else 'no'})")
        print("::error::The site refused all 5 attempts.")
        print("::error::Datacenter ranges are challenged by Cloudflare, so a runner needs a")
        print("::error::working BAZARAKI_PROXY; check the secret, or use a self-hosted runner.")
        sys.exit(1)
        PY

    - name: Run scraper
      env:
        BAZARAKI_PROXY: ${{ secrets.BAZARAKI_PROXY }}
      run: |
        uv run scrapy crawl property_spider -a urls=https://www.bazaraki.com/real-estate-to-rent,https://www.bazaraki.com/real-estate-for-sale

    # A crawl that scrapes nothing still exits 0 and still writes a file, which used to
    # show up as a green run for weeks. Make an empty crawl fail loudly instead.
    - name: Check crawl produced data
      if: always()
      run: |
        tail -40 output/logs/*.log || true
        uv run python - <<'PY'
        import glob, sys
        import pandas as pd
        files = sorted(glob.glob("output/*.parquet"))
        if not files:
            sys.exit("No parquet written")
        rows = len(pd.read_parquet(files[-1]))
        print(f"{files[-1]}: {rows} ads")
        if rows < 1000:
            sys.exit(f"Crawl returned {rows} ads, expected tens of thousands")
        PY
        
    - name: Configure AWS credentials
      if: success()
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # Change this to your preferred region

    - name: Sync to S3
      if: success()
      run: |
        aws s3 sync output s3://ab-users/grachev/bazaraki/output

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: scraper-logs
        path: output/logs/
        retention-days: 7
